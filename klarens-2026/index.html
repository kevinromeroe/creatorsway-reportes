<title>Reporte de contenido</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="theme-color" content="#0A0A0A">

<style>
/* Diseño aprobado (2026-11-05): barra superior negra con el menú del reporte; fondo gris cálido con tarjetas
   blancas muy redondeadas; amarillo CreatorsWay para lo activo y la cifra principal; negro y amarillo para las redes. */
:root{
  --fondo:#F2F2EF; --tarjeta:#FFFFFF; --negro:#000000; --barra:#0A0A0A;
  --amarillo:#E3E935; --amarillo-suave:#F4F7B8; --pista:#ECECE8; --linea:#ECECE8; --gris-tabla:#D9D9D9;
  --klarens:#0B1F8F; --ig:#0A0A0A; --tt:#E3E935; --fb:#1877F2;
  --sube:#2F7A3B; --sube-bg:#E5F1E6; --baja:#C2410C; --baja-bg:#FBE9DF; --media-bg:#F0F0EC;
  --sombra:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  --r:22px; --f:"Plus Jakarta Sans",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--negro);font:400 15px/1.5 var(--f)}
h1,h2,h3,p{margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* barra superior */
.top{position:sticky;top:0;z-index:9;background:var(--barra);color:#fff;padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:28px;padding-block:14px}
.top .cw{height:34px;width:auto;flex:0 0 auto}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.nav button{flex:0 0 auto;background:transparent;border:0;color:#E8E8E8;font:500 14px var(--f);padding:10px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.nav button:hover{background:#1C1C1C;color:#fff}
.nav button.on{background:var(--amarillo);color:#000;font-weight:700}
.nav button:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}
.nav svg{width:16px;height:16px}
.top-r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.period{border:1px solid #333;border-radius:12px;padding:9px 14px;font-size:14px;white-space:nowrap}
.btn.yel{background:#000;color:#fff;border:1px solid #3A3A3A;padding:10px 16px;font-size:14px}
.btn.yel:hover{background:#1C1C1C}
.title h1{display:flex;align-items:center;flex-wrap:wrap;gap:.12em .3em}
.title h1 .tlogo{height:2.4em;width:auto}
.title h1 .x{line-height:1}
.tabhead{display:flex;align-items:center;gap:12px}
.tabhead h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tabhead span.s{font-size:15px}
.pbadge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.pbadge svg{width:22px;height:22px}
.pbadge.ig{background:radial-gradient(circle at 30% 107%,#FDF497 0%,#FD5949 45%,#D6249F 60%,#285AEB 90%)}
.pbadge.tt{background:#000}
.pbadge.fb{background:var(--fb)}
.fill.fb{background:var(--fb)}
.sbar .fb{background:var(--fb)}
.aprox{font-size:12px;font-weight:600;margin-left:4px}
.pbadge.tt svg{filter:drop-shadow(-1px -1px 0 #25F4EE) drop-shadow(1px 1px 0 #FE2C55)}
.sec-t{display:grid;gap:4px;margin-top:12px}
.sec-t h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sec-t p{font-size:15px;max-width:72ch}
.kpi .ins{font-size:13px;line-height:1.45;border-top:1px solid var(--linea);padding-top:10px;margin-top:2px}
.kpi.hi .ins{border-top-color:rgba(0,0,0,.18)}
.kpi .ins b{font-weight:800}
.callout{display:block;font-size:14px;line-height:1.55}
.callout b{font-weight:800}
.foot{display:grid;gap:14px}
.foot-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.legal{border-top:1px solid #D6D6D2;padding-top:14px;display:grid;gap:8px;font-size:12.5px;line-height:1.5}
.legal nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.legal a{color:#000;text-decoration:underline;text-underline-offset:2px}

/* página */
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.wrap > *{min-width:0}
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:8px}
.title h1{font-size:clamp(30px,4vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.title h1 .jft{background:var(--amarillo);padding:0 .14em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.title h1 .kl{color:var(--klarens)}
.title .sub{font-size:16px;margin-top:8px;max-width:70ch}
.title-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title-r img{height:52px;width:auto}
.btn{background:#000;color:#fff;border:0;border-radius:12px;padding:13px 20px;font:700 15px var(--f);cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn.ghost{background:#fff;color:#000;box-shadow:var(--sombra)}
.btn:focus-visible{outline:2px solid #000;outline-offset:2px}

.card{background:var(--tarjeta);border-radius:var(--r);box-shadow:var(--sombra);padding:26px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card-h h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.card-h p{font-size:14px;margin-top:4px}
.legend{display:flex;gap:16px;font-size:13px;flex:0 0 auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.tt,.dot.tt{box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}

/* cifras */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.kpi{display:grid;gap:14px;align-content:start}
.kpi .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .k{font-size:15px;font-weight:500}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--fondo);display:grid;place-items:center;flex:0 0 auto}
.kpi .ic svg{width:16px;height:16px}
.kpi .v{font-size:clamp(28px,2.6vw,38px);font-weight:800;line-height:1;letter-spacing:-.02em}
.kpi .d{font-size:13px}
.kpi.hi{background:var(--amarillo)}
.kpi.hi .ic{background:rgba(255,255,255,.55)}

.duo{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:stretch}
.chart{position:relative}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) 96px;gap:20px;align-items:center;padding:14px 0;border-top:1px solid var(--linea)}
.cname{display:flex;gap:12px;align-items:center;min-width:0}
.cname > div{min-width:0}
.thumb{flex:0 0 auto;display:block;width:46px;height:82px;border-radius:10px;overflow:hidden;background:var(--pista)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:focus-visible{outline:2px solid #000;outline-offset:2px}
.title h1 .tavatar{width:2.2em;height:2.2em;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--linea)}
.cname strong{display:block;font-weight:700;font-size:15px;line-height:1.3}
.cname span{font-size:13px}
.bars{display:grid;gap:5px}
.b{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px;font-weight:600}
.b .track{height:10px;border-radius:99px;background:var(--pista)}
.b .fill{height:100%;border-radius:99px}
.fill.ig{background:var(--ig)} .fill.tt{background:var(--tt)}
.b:focus-visible{outline:2px solid #000;outline-offset:3px;border-radius:6px}
.er{justify-self:end;display:grid;justify-items:end;gap:5px}
.er .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--media-bg);white-space:nowrap}
.pill.alta{background:var(--sube-bg);color:var(--sube)}
.pill.baja{background:var(--baja-bg);color:var(--baja)}
.tip{position:absolute;pointer-events:none;background:#000;color:#fff;font-size:13px;line-height:1.45;padding:8px 12px;border-radius:10px;white-space:nowrap;z-index:2}

.share{display:grid;gap:18px}
.srow{display:grid;gap:8px}
.srow .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.srow .t b{font-weight:700}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;background:#fff}
.sbar .ig{background:var(--ig)} .sbar .tt{background:var(--tt)}
.callout{background:var(--fondo);border-radius:16px;padding:16px 18px;margin:20px 0 0;display:block}
.callout b{font-weight:700}
.callout span{font-size:14px}

.finds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.find{display:grid;gap:10px;align-content:start}
.find .v{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.03em}
.find h3{font-size:17px;font-weight:700;line-height:1.3}
.find p{font-size:14px}
.find.hi{background:#000;color:#fff}
.find.hi .v{color:var(--amarillo)}

.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.quote{margin:0;display:grid;gap:10px;align-content:start}
.quote .qt{font-size:12px;font-weight:700;background:var(--fondo);border-radius:999px;padding:3px 10px;justify-self:start}
.quote blockquote{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.quote figcaption{font-size:13px}
.duo.inner{gap:32px}
.nets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.net-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 13px var(--f);flex:0 0 auto}
.badge.ig{background:var(--ig);color:#fff} .badge.tt{background:var(--tt);color:#000}
.net-h strong{font-size:17px;display:block}
.net-h span{font-size:13px}
.net-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.net-g div{display:grid;gap:2px}
.net-g .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.net-g .k{font-size:13px}

/* comparación de una pieza */
.vs{display:grid;gap:16px}
.vsr{display:grid;gap:8px}
.vsr .t{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;font-size:14px;align-items:baseline}
.vsr .t .a{font-weight:800;font-size:17px}
.vsr .t .m{font-weight:600;text-align:center}
.vsr .t .z{font-weight:800;font-size:17px;text-align:right}
.note{font-size:15px;line-height:1.6}
.facts{display:grid;gap:10px;margin-top:18px}
.facts div{display:flex;justify-content:space-between;gap:12px;background:var(--fondo);border-radius:12px;padding:10px 14px;font-size:14px}
.facts b{font-weight:800;white-space:nowrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--linea)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:14px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th.l,td.l{text-align:left}
thead th{background:var(--gris-tabla);font-weight:700;font-size:13px}
tbody td{border-top:1px solid var(--linea)}
tbody tr.hl td{background:var(--amarillo-suave)}
tfoot td{font-weight:800;border-top:2px solid #000}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.mini{display:inline-block;height:6px;border-radius:99px;background:#000;vertical-align:middle;margin-left:8px}
.hand{display:block;font-size:11.5px}

.stories{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.sfigs{display:grid;gap:12px}
.sfigs div{background:var(--fondo);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.sfigs div:first-child{background:var(--amarillo)}
.sfigs .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sfigs span{font-size:13px}

.foot{font-size:13px;padding-top:8px}
.foot img{height:16px;width:auto}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hi{grid-column:1 / -1}
  .duo,.nets,.finds,.quotes{grid-template-columns:minmax(0,1fr)}
    .period{display:none}
  .btn.yel{padding:9px 12px}
}
@media (max-width:640px){
  .crow{grid-template-columns:minmax(0,1fr) auto;gap:10px 14px}
  .crow .bars{grid-column:1 / -1;grid-row:2}
  .stories{grid-template-columns:minmax(0,1fr)}
  .card{padding:20px}
  .net-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-in{gap:16px}
    .top .cw{height:26px}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top{position:static}
  .btn,.tip{display:none!important}
  .card,.kpi,.find{break-inside:avoid}
  .page{padding-block:16px 0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

const footer=()=>`<footer class="foot"><div class="foot-top"><span>Fuente: informe del creador (Instagram Insights y TikTok Studio), con visualizaciones, me gusta, comentarios y compartidos de Instagram, TikTok y Facebook actualizados a las cifras públicas${D.publicasCapturado?' al '+fechaLarga(D.publicasCapturado):''}; alcance, guardados y audiencia tal como vienen en el informe; comentarios públicos de las publicaciones.</span><img src="../assets/logo-creatorsway-negro.png" alt="CreatorsWay"></div>${LEGAL}</footer>`;

const legend=ks=>`<div class="legend">${ks.map(k=>`<span><i class="${k}" style="background:var(--${k})"></i>${NET[k]}</span>`).join('')}</div>`;
const insight=(t,b)=>`<p class="callout">${t?`<b>${t}:</b> `:''}${b}</p>`;
const sh=(t,p)=>`<div class="sec-t"><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div>`;
const dec=(v,d=1)=>v.toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});

/* barras de visualizaciones por pieza: una o las dos redes */
function piecesChart(ks){
  const P=D.pieces,max=Math.max(...P.flatMap(p=>ks.map(k=>p[k].v)));
  const bar=(k,o)=>`<div class="b" tabindex="0" data-tip="${NET[k]}: ${nf.format(o.v)} visualizaciones, ${nf.format(o.i)} interacciones, ${nf.format(o.s)} guardados"><div class="track"><div class="fill ${k}" style="width:${(o.v/max*100).toFixed(1)}%"></div></div><span class="num">${short(o.v)}</span></div>`;
  const soloFb=ks.length===1&&ks[0]==='fb';
  return `<div class="chart" id="chart">${P.map(p=>{const er=ks.length>1?p.er:p[ks[0]].er,l=ks.length>1?p.lvl:lvl(er);
    const href=(ks.length>1?p.ig.url:p[ks[0]].url)||'';
    const th=p.img?`<a class="thumb" href="${esc(href)}" target="_blank" rel="noopener" aria-label="Ver ${esc(p.s)}"><img src="../${esc(p.img)}" alt="" loading="eager"></a>`:'';
    return `<div class="crow"><div class="cname">${th}<div><strong>${esc(p.t)}</strong><span>${p.f}${p.collab?', con '+esc(p.collab):''}</span></div></div><div class="bars">${ks.map(k=>bar(k,p[k])).join('')}</div><div class="er"><span class="v num">${pct(er)}</span>${soloFb?'':pill(l)}</div></div>`;}).join('')}<div class="tip" id="tip" hidden></div></div>`;
}

/* ---------- conversación (comentarios) ---------- */
const NETL={ig:'Instagram',tt:'TikTok',fb:'Facebook'};
const temaBars=(temas,color)=>{const mx=Math.max(...temas.map(t=>t.share));
  return `<div class="share">${temas.map(t=>`<div class="srow"><div class="t"><b>${esc(t.label)}</b><span class="num">${nf.format(t.n)} · ${pct(t.share,0)}</span></div><div class="sbar" style="background:var(--pista)"><div style="width:${t.share/mx*100}%;background:${color}"></div></div></div>`).join('')}</div>`;};
const tonoBars=t=>{const rows=[['Positivos',t.positivo,'var(--sube)'],['Negativos',t.negativo,'var(--baja)'],['Dudas: qué es, dónde se consigue, con qué reemplazarlo',t.duda,'#9A9A95']];const mx=Math.max(...rows.map(r=>r[1]));
  return `<div class="share">${rows.map(r=>`<div class="srow"><div class="t"><b>${r[0]}</b><span class="num">${nf.format(r[1])}</span></div><div class="sbar" style="background:var(--pista)"><div style="width:${r[1]/mx*100}%;background:${r[2]}"></div></div></div>`).join('')}</div>`;};
function convResumen(){
  const C=D.conv;if(!C)return '';const T=C.tono,th=Object.fromEntries(C.temas.map(t=>[t.k,t]));
  const quotes=C.destacados.map(q=>`<figure class="card quote"><span class="qt">${esc(q.tema)}</span><blockquote>“${esc(q.texto)}”</blockquote><figcaption class="num">${nf.format(q.me_gusta)} me gusta · ${NETL[q.red]} · ${esc(q.pieza)}</figcaption></figure>`).join('');
  return sh('Lo que dice la gente',`Leímos ${nf.format(C.n)} comentarios de las ${D.pieces.length*D.netList.length} publicaciones (el ${pct(C.coverage,0)} de los que reportan las plataformas) y los clasificamos por tema.`)+
  `<div class="duo">
    <section class="card"><div class="card-h"><div><h2>Temas de la conversación</h2><p>Comentarios y respuestas, por tema principal</p></div></div>${temaBars(C.temas,'#000')}
      ${insight('',`${pct(th.antojo.share,0)} es antojo y elogio, y otro ${pct(th.humor.share,0)} reacciona a los detalles del video, como el tenedor o el celular en la nevera: esos comentarios son los que más me gusta reciben. El ${pct(C.fit_top_share,0)} del debate sobre si la comida es fit se dio en ${esc(C.fit_top_piece)}.`)}</section>
    <section class="card"><div class="card-h"><div><h2>El suero y ${esc(D.marca.nombre)}</h2><p>${nf.format(T.positivo+T.negativo+T.duda+T.neutro)} comentarios que hablan del suero o de la marca</p></div></div>${tonoBars(T)}
      ${insight(`${C.opinion_pos>=.6?'2 de cada 3':pct(C.opinion_pos,0)} opiniones son positivas`,`de las ${T.negativo} críticas, ${T.neg_autenticidad} cuestionan que sea suero costeño auténtico y ${T.neg_salud} señalan los sellos de advertencia. ${esc(C.marca_top_piece)} fue la pieza con más conversación de marca: el ${pct(C.marca_top_share,0)} de sus comentarios habla del suero.`)}
      <p class="callout"><b>${nf.format(T.duda)} dudas sobre el producto:</b> ${nf.format(T.duda_fuera)} vienen de fuera de Colombia y preguntan qué es el suero costeño o con qué reemplazarlo.</p></section>
  </div>
  <section class="quotes" aria-label="Comentarios destacados">${quotes}</section>`;
}
function convRed(k){
  const C=D.conv;if(!C||!C.redes[k])return '';const R=C.redes[k],o=k==='tt'?'ig':k==='ig'?'tt':'ig',O=C.redes[o];
  const so=Object.fromEntries(O.temas.map(t=>[t.k,t.share]));
  const mas=R.temas.filter(t=>!['otros','etiqueta'].includes(t.k)).map(t=>({...t,d:t.share-(so[t.k]||0)})).sort((a,b)=>b.d-a.d).filter(t=>t.d>0.02).slice(0,2);
  const T=R.tono,opin=(T.positivo||0)+(T.negativo||0);
  const txt=mas.length?`Frente a ${NETL[o]}, aquí hay más ${mas.map(t=>`${t.label.toLowerCase()} (${pct(t.share,0)} contra ${pct(so[t.k]||0,0)})`).join(' y ')}.`:'';
  return sh(`Conversación en ${NETL[k]}`,`${nf.format(R.n)} comentarios leídos de ${nf.format(R.total)} que reporta la plataforma.`)+
  `<section class="card"><div class="duo inner">
    <div><div class="card-h"><div><h2>Temas</h2></div></div>${temaBars(R.temas,`var(--${k})`)}</div>
    <div><div class="card-h"><div><h2>El suero y ${esc(D.marca.nombre)}</h2></div></div>${tonoBars({positivo:T.positivo||0,negativo:T.negativo||0,duda:T.duda||0})}</div>
  </div>${insight('',`${txt} Sobre la marca: ${T.positivo||0} opiniones positivas y ${T.negativo||0} negativas${opin?` (${pct((T.positivo||0)/opin,0)} positivas)`:''}, y ${T.duda||0} dudas sobre el producto.`)}</section>`;
}

/* ---------- resumen ---------- */
function vResumen(){
  const T=D.totals,P=D.pieces,I=D.insights,N=D.nets;
  const kpiI=(k,v,d,ic,ins,hi)=>`<article class="card kpi${hi?' hi':''}"><div class="row"><span class="k">${k}</span><span class="ic">${svg(ic)}</span></div><span class="v num">${v}</span><span class="d">${d}</span><p class="ins">${ins}</p></article>`;
  const share=D.share.map(s=>{const ks=Object.keys(s.vals),tot=ks.reduce((a,k)=>a+s.vals[k],0);
    return `<div class="srow"><div class="t"><b>${s.k}${ks.length<D.netList.length?' <span class="aprox">(sin Facebook)</span>':''}</b><span class="num">${ks.map(k=>Math.round(s.vals[k]/tot*100)+' %').join(' · ')}</span></div><div class="sbar">${ks.map(k=>`<div class="${k}" style="width:${s.vals[k]/tot*100}%"></div>`).join('')}</div></div>`;}).join('');
  let det='';
  P.forEach(p=>D.netList.forEach((k,j)=>{const o=p[k],fb=k==='fb';det+=`<tr class="${p.best?'hl':''}"><td>${j?'':`<strong>${esc(p.t)}</strong>`}</td><td class="l"><span class="dot ${k}" style="background:var(--${k})"></span>${NET[k]}</td><td class="num">${nf.format(o.v)}</td><td class="num">${fb?'—':nf.format(o.r)}</td><td class="num">${nf.format(o.i)}${o.likes_aprox?'<span class="aprox">≈</span>':''}</td><td class="num">${fb?'—':pct(o.er)}</td><td class="num">${fb?'—':nf.format(o.s)}</td></tr>`;}));
  const ttw=I.tt_wins_er_pieces;
  return header()+
  sh('La campaña en cifras','Qué tanto se vio el contenido, cuánta gente lo vio y cómo reaccionó. Debajo de cada cifra, lo que significa.')+
  `<section class="kpis" aria-label="Resumen de la campaña">${
    kpiI('Visualizaciones',short(T.views_all),`Instagram, TikTok y Facebook, e historias`,'eye',`<b>${short(I.fb_views)}</b> llegaron por Facebook: el ${pct(I.fb_share_meta,0)} de lo que se vio en Meta.`,1)+
    kpiI('Alcance',short(T.reach_all),'Instagram y TikTok, sumado por pieza (Facebook no lo publica)','users',`TikTok aportó el <b>${pct(I.tt_reach_share,0)}</b> del alcance de las recetas.`)+
    kpiI('Interacciones',nf.format(T.inter_all),'Me gusta, comentarios, compartidos y guardados en las 3 redes','heart',`En Instagram y TikTok, <b>${pct(T.saves_share_inter,0)}</b> fueron guardados: la gente se lleva la receta.`)+
    kpiI('Tasa de interacción',pct(T.er),'Interacciones ÷ alcance, Instagram y TikTok','rate',`Por cada 100 cuentas alcanzadas hubo <b>${Math.round(I.inter_per_100)} interacciones</b>.`)+
    kpiI('Seguidores nuevos',nf.format(T.newf_ig),'En Instagram','plus',`El <b>${pct(I.newf_best_share,0)}</b> llegó con ${esc(I.newf_best_piece)}.`)}</section>
  ${sh('Pieza por pieza y red por red','Cuál receta funcionó mejor y qué aportó cada plataforma.')}
  <div class="duo">
    <section class="card"><div class="card-h"><div><h2>Visualizaciones por pieza</h2><p>A la derecha, la tasa de interacción de cada receta en Instagram y TikTok.</p></div>${legend(D.netList)}</div>${piecesChart(D.netList)}
      ${insight('',`${esc(I.top_piece)} tuvo ${dec(I.top_vs_second)} veces las visualizaciones de ${esc(I.second_piece)}, la segunda pieza. ${esc(I.low_piece)} fue la de menos visualizaciones${I.low_is_last_in_both?' en todas las redes':''}: el formato de receta útil supera al video de proceso.`)}</section>
    <section class="card"><div class="card-h"><div><h2>Resultados por red</h2><p>Participación de cada red en el total</p></div></div>
      <div class="share">${legend(D.netList)}${share}</div>
      ${insight(esc(D.textos.redes.titulo),esc(D.textos.redes.texto))}</section>
  </div>
  ${convResumen()}
  ${sh('Hallazgos','Lo que la marca debería llevarse de esta campaña.')}
  <section class="finds" aria-label="Hallazgos">${D.hallazgos.map((h,i)=>`<article class="card find${i?'':' hi'}"><span class="v num">${pctAuto(h.v)}</span><h3>${esc(h.titulo)}</h3><p>${esc(h.texto)}</p></article>`).join('')}</section>
  ${sh('Detalle','Todas las cifras por pieza y por red, para consultar.')}
  <section class="card"><div class="card-h"><div><h2>Detalle por pieza y red</h2><p>Resaltada, la pieza con mejor resultado. Facebook no publica alcance ni guardados (—); sus reacciones desde 10 mil vienen abreviadas (≈). Alcance, tasa y guardados del total: Instagram y TikTok.</p></div></div>
    <div class="tbl"><table><thead><tr><th>Pieza</th><th class="l">Red</th><th>Visualizaciones</th><th>Alcance</th><th>Interacciones</th><th>Tasa</th><th>Guardados</th></tr></thead><tbody>${det}</tbody>
    <tfoot><tr><td>Total</td><td></td><td class="num">${nf.format(T.views)}</td><td class="num">${nf.format(T.reach)}</td><td class="num">${nf.format(T.inter)}</td><td class="num">${pct(T.er)}</td><td class="num">${nf.format(T.saves)}</td></tr></tfoot></table></div>
    ${insight('',`Instagram tuvo mejor tasa de interacción en ${I.ig_wins_er} de las ${I.n_pieces} piezas${ttw.length?`; TikTok solo ganó en ${ttw.map(esc).join(' y ')}`:''}. TikTok compensa con más alcance: llega a más cuentas, aunque reaccionan menos.`)}</section>
  ${footer()}`;
}

  const wins=I.wins_vs_other;
  return header()+tabhead('tt',`${P.length} videos`)+
  sh('TikTok en cifras','Resultados de los videos. Debajo de cada cifra, lo que significa.')+
  `<section class="kpis">${
    kpiN('Visualizaciones',short(N.v),'De los '+P.length+' videos','eye',`El <b>${pct(I.top_share_views,0)}</b> vino de ${esc(I.top_piece)}.`,1)+
    kpiN('Alcance',short(N.r),'Total de espectadores','users',`<b>${pct(I.reach_vs_other,0)} más cuentas</b> que Instagram (${short(ig.r)}).`)+
    kpiN('Interacciones',nf.format(N.i),'Likes, comentarios, compartidos y guardados','heart',`<b>${nf.format(I.inter_vs_other)} más</b> que Instagram, con menos visualizaciones.`)+
    kpiN('Tasa de interacción',pct(N.er),'Interacciones ÷ alcance','rate',`<b>${pts(I.er_diff_pts)} menos</b> que Instagram (${pct(ig.er)}): llega a más gente, que reacciona menos.`)+
    kpiN('Público nuevo',pct(N.non_followers,0),'No seguía a '+esc(D.creador.nombre),'plus',`Aun así, el <b>${pct(1-N.new_viewers,0)}</b> ya había visto videos suyos en el último año.`)}</section>
  ${sh('Video por video','Cuál video se vio más y a quién le llegó cada uno.')}
  <div class="duo">
    <section class="card"><div class="card-h"><div><h2>Visualizaciones por video</h2><p>A la derecha, la tasa de interacción de cada video.</p></div></div>${piecesChart(['tt'])}
      ${insight('',`${I.n_alta} de los ${P.length} videos tuvieron una tasa alta.${wins.length?` TikTok superó la tasa de Instagram solo en ${wins.map(esc).join(' y ')}.`:''}`)}</section>
    <section class="card"><div class="card-h"><div><h2>Audiencia</h2><p>Porcentaje de espectadores que no seguían a ${esc(D.creador.nombre)}, por video</p></div></div>
      <div class="share">${aud}</div>
      ${insight(`${pct(N.women,0)} mujeres y ${pct(N.men,0)} hombres`,`en promedio por video. Las recetas atraen más público femenino: ${pct(I.women_max,0)} en ${esc(I.women_max_piece)} frente a ${pct(I.women_min,0)} en ${esc(I.women_min_piece)}.`)}</section>
  </div>
  ${convRed('tt')}
  <section class="card"><div class="card-h"><div><h2>Detalle por video</h2><p>Resaltado, el video con mejor resultado.</p></div></div>
    <div class="tbl"><table><thead><tr><th>Video</th><th>Duración</th><th>Visualizaciones</th><th>Alcance</th><th>Me gusta</th><th>Comentarios</th><th>Compartidos</th><th>Guardados</th><th>Tasa</th><th>No seguidores</th><th>Mujeres</th></tr></thead><tbody>${det}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${sec(N.dur_s)}</td><td class="num">${nf.format(N.v)}</td><td class="num">${nf.format(N.r)}</td><td class="num">${nf.format(P.reduce((a,p)=>a+p.tt.likes,0))}</td><td class="num">${nf.format(I.comments)}</td><td class="num">${nf.format(N.shares)}</td><td class="num">${nf.format(N.s)}</td><td class="num">${pct(N.er)}</td><td class="num">${pct(N.non_followers,0)}</td><td class="num">${pct(N.women,0)}</td></tr></tfoot></table></div>
    ${insight('',`Los videos duraron entre ${sec(I.dur_min)} y ${sec(I.dur_max)}.${I.shortest_is_top&&I.longest_is_low?` El más corto, ${esc(I.shortest)}, fue el más visto, y el más largo, ${esc(I.longest)}, el menos visto: en TikTok, ir al grano rinde.`:''}`)}</section>
  ${footer()}`;
}


/* ---------- Facebook ---------- */
function vFacebook(){
  const N=D.nets.fb,P=D.pieces,I=D.insFb,ig=D.nets.ig;if(!N)return '';
  const meta=P.map(p=>{const w=p.ig.v/(p.ig.v+p.fb.v)*100;return `<div class="srow"><div class="t"><b>${esc(p.s)}</b><span class="num">Instagram ${Math.round(w)} % · Facebook ${Math.round(100-w)} %</span></div><div class="sbar"><div class="ig" style="width:${w}%"></div><div class="fb" style="width:${100-w}%"></div></div></div>`;}).join('');
  const det=P.map(p=>{const o=p.fb;return `<tr class="${p.best?'hl':''}"><td><strong>${esc(p.t)}</strong></td><td class="num">${nf.format(o.v)}</td><td class="num">${nf.format(o.likes)}${o.likes_aprox?'<span class="aprox">≈</span>':''}</td><td class="num">${nf.format(o.comments)}</td><td class="num">${nf.format(o.shares)}</td><td class="num">${nf.format(o.i)}</td><td class="num">${pct(o.er)}</td><td class="l">${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener">Ver reel</a>`:''}</td></tr>`;}).join('');
  return header()+tabhead('fb',`${P.length} reels en la página Juan FoodTime, publicados junto con Instagram`)+
  sh('Facebook en cifras','Los mismos reels de Instagram, publicados también en Facebook. Debajo de cada cifra, lo que significa.')+
  `<section class="kpis">${
    kpiN('Visualizaciones',short(N.v),'De los '+P.length+' reels','eye',`El <b>${pct(I.share_meta,0)}</b> de lo que se vio en Meta llegó por Facebook.`,1)+
    kpiN('Reacciones',(N.likes_aprox?'≈ ':'')+short(N.likes),'Me gusta y demás reacciones','heart',`Facebook muestra abreviadas las reacciones desde 10 mil, por eso la cifra es aproximada.`)+
    kpiN('Comentarios',nf.format(N.comments),'En los '+P.length+' reels','users',`Instagram tuvo <b>${nf.format(ig.comments)}</b>: en Facebook la gente mira más de lo que comenta.`)+
    kpiN('Compartidos',nf.format(N.shares),'Veces compartido','plus',`El <b>${pct(I.shares_share,0)}</b> de las interacciones en Facebook fueron compartidos.`)+
    kpiN('Interacción por visualización',pct(N.er),'Interacciones ÷ visualizaciones','rate',`Instagram, medido igual, tiene <b>${pct(I.ig_er_views)}</b>. Facebook no publica alcance.`)}</section>
  ${sh('Reel por reel','Cuánto se vio cada reel en Facebook y cuánto pesó frente a Instagram.')}
  <div class="duo">
    <section class="card"><div class="card-h"><div><h2>Visualizaciones por reel</h2><p>A la derecha, interacciones ÷ visualizaciones de cada reel.</p></div></div>${piecesChart(['fb'])}
      ${insight('',`${esc(I.top_piece)} reunió el ${pct(I.top_share_views,0)} de las visualizaciones en Facebook.`)}</section>
    <section class="card"><div class="card-h"><div><h2>Facebook frente a Instagram</h2><p>Reparto de las visualizaciones de cada reel en Meta</p></div></div>
      <div class="share">${legend(['ig','fb'])}${meta}</div>
      ${insight('',I.over_ig.length?`En ${I.over_ig.map(esc).join(' y ')}, Facebook superó a Instagram: el ${pct(I.top_meta_share,0)} de sus visualizaciones en Meta llegó por Facebook.`:`Instagram superó a Facebook en todos los reels.`)}</section>
  </div>
  ${convRed('fb')}
  <section class="card"><div class="card-h"><div><h2>Detalle por reel</h2><p>≈ cifra abreviada por Facebook. Interacciones = reacciones + comentarios + compartidos.</p></div></div>
    <div class="tbl"><table><thead><tr><th>Reel</th><th>Visualizaciones</th><th>Reacciones</th><th>Comentarios</th><th>Compartidos</th><th>Interacciones</th><th>Interacción por visualización</th><th class="l">Enlace</th></tr></thead><tbody>${det}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${nf.format(N.v)}</td><td class="num">${nf.format(N.likes)}</td><td class="num">${nf.format(N.comments)}</td><td class="num">${nf.format(N.shares)}</td><td class="num">${nf.format(N.i)}</td><td class="num">${pct(N.er)}</td><td></td></tr></tfoot></table></div></section>
  ${footer()}`;
}

/* ---------- navegación ---------- */
const TABS=[{id:'resumen',label:'Resumen',icon:'grid'},{id:'instagram',label:'Instagram',icon:'ig'},{id:'tiktok',label:'TikTok',icon:'tt'},{id:'facebook',label:'Facebook',icon:'fb'}].filter(t=>D.tabs.includes(t.id));
window.REPORT_TABS=TABS.map(t=>t.id);
document.getElementById('nav').innerHTML=TABS.map(t=>`<button type="button" id="tab-${t.id}" data-tab="${t.id}">${t.icon?svg(t.icon):''}${esc(t.label)}</button>`).join('');
document.getElementById('period').textContent=D.periodo;
document.title=`Reporte de contenido · ${D.creador.nombre} × ${D.marca.nombre}`;

function bindTips(){
  const chart=document.getElementById('chart'),tip=document.getElementById('tip');if(!chart)return;
  const show=el=>{const r=el.getBoundingClientRect(),pr=chart.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.hidden=false;
    tip.style.left=Math.max(0,Math.min(r.left-pr.left,pr.width-tip.offsetWidth))+'px';tip.style.top=(r.top-pr.top-tip.offsetHeight-6)+'px';};
  chart.querySelectorAll('.b').forEach(b=>{b.addEventListener('mouseenter',()=>show(b));b.addEventListener('focus',()=>show(b));b.addEventListener('mouseleave',()=>tip.hidden=true);b.addEventListener('blur',()=>tip.hidden=true);});
}
function go(id){
  if(!window.REPORT_TABS.includes(id)) id='resumen';
  document.getElementById('view').innerHTML=id==='instagram'?vInstagram():id==='tiktok'?vTiktok():id==='facebook'?vFacebook():vResumen();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));
  document.getElementById('pdf').href=`${D.pdfBase||'pdf'}/${id}.pdf`;
  bindTips();
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(location.hash!=='#'+b.dataset.tab) history.replaceState(null,'','#'+b.dataset.tab);go(b.dataset.tab);window.scrollTo(0,0);});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1));
</script>
</body>

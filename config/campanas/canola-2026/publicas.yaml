# Son la fuente de visualizaciones, me gusta, comentarios y compartidos (y guardados de TikTok).
# Del Excel solo se usa lo que no es público: alcance, guardados y reposts de Instagram, e historias.
#
# Instagram: /api/v1/media/<id>/info/ → ig_play_count (solo Instagram), fb_play_count (reproducciones
#            de la publicación cruzada a Facebook, desde la cuenta del creador), like_count,
#            comment_count, reshare_count, duración y coautores. La clave es el código del reel.
#            `coautor: null` = el reel no está marcado como colaboración con @canola.life.
# TikTok:    datos de la página del video (statsV2). Fecha en hora de Bogotá.
# Facebook:  solo las reproducciones (fb_views). Las reacciones y comentarios de la publicación cruzada
#            quedan en la página de Facebook de cada creador y no se suman.

# Cifras públicas de cada publicación, leídas por Datalítica con Claude en Chrome.
# Son la fuente de visualizaciones, me gusta/reacciones, comentarios y compartidos.
# Del Excel del creador solo se usa lo que no es público (alcance, guardados y reposts de
# Instagram, tiempo de reproducción, seguidores nuevos, audiencia de TikTok e historias).
#
# Instagram: /api/v1/media/<id>/info/  → ig_play_count (solo Instagram), like_count,
#            comment_count, reshare_count. La cifra "Visualizaciones" del Excel suma
#            Instagram + Facebook (publicación cruzada); aquí se separan.
# TikTok:    datos de la página del video (statsV2).
# Facebook:  página oficial "Juan FoodTime" (facebook.com/foodtimecali). Visualizaciones =
#            fb_play_count de la API de Instagram; reacciones, comentarios y compartidos de la
#            página del reel. Facebook muestra abreviadas las reacciones desde 10 mil.
